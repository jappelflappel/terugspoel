<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="canonical" href="https://jappelflappel.github.io/mokje-gokje/">
  <title>Mokje Gokje</title>
</head>
<body>
  <main>
    <h1>Mokje Gokje</h1>
    <p><a id="play" href="https://jappelflappel.github.io/mokje-gokje/">Open Mokje Gokje</a></p>
  </main>
  <script>
    const link = document.getElementById('play');
    const destination = new URL(link.href);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    link.href = destination.href;
    window.location.replace(destination.href);
  </script>
</body>
</html>
